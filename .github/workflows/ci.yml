name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          # Valeurs factices : le build n'a besoin que de leur présence, aucun secret.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Vérification des types
        working-directory: supabase/functions
        run: deno check _shared/*.ts verify-kkiapay/*.ts kkiapay-webhook/*.ts delete-account/*.ts
      - name: Tests
        working-directory: supabase/functions
        run: deno test --no-prompt -A

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Simulation de Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/local-stubs.sql
      - name: Migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Tests de sécurité (attaques qui doivent échouer)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security.test.sql
