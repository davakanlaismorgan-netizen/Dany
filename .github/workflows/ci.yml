name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Une nouvelle poussée annule l'exécution précédente de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build
        env:
          # Valeurs factices : le build n'a besoin que de leur présence, aucun secret.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Vérification des types
        working-directory: supabase/functions
        run: deno check _shared/*.ts verify-kkiapay/*.ts kkiapay-webhook/*.ts delete-account/*.ts process-dataset/*.ts run-pipeline/*.ts run-automl/*.ts generate-report/*.ts
      - name: Tests
        working-directory: supabase/functions
        run: deno test --no-prompt -A

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simulation de Supabase
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/local-stubs.sql
      - name: Migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Tests de sécurité (attaques qui doivent échouer)
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/security.test.sql
